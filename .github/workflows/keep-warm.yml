# Optional: Render's free web services sleep after 15 minutes without traffic, so the first visitor
# waits up to a minute. This pings the API every 14 minutes during working hours (UTC) to keep it
# warm. One always-on service stays within Render's 750 free instance-hours a month.
# Enable by setting the repository variable API_BASE_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: Keep API warm

on:
  schedule:
    - cron: "*/14 3-18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.API_BASE_URL }}/api/v1/health" > /dev/null
